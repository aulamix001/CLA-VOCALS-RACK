name: Windows x64 VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify original references
        run: python scripts/verify_sources.py
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build VST3 and tests
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows VST3
        shell: pwsh
        run: |
          $bundle = 'build/VocalsRack_artefacts/Release/VST3/Vocals Rack.vst3'
          if (-not (Test-Path "$bundle/Contents/x86_64-win/Vocals Rack.vst3")) {
            throw 'Windows x64 VST3 binary missing'
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/editor-preview.png dist/Vocals-Rack-Interface.png
          Compress-Archive -LiteralPath $bundle -DestinationPath dist/Vocals-Rack-Windows-x64-VST3.zip
          (Get-FileHash dist/Vocals-Rack-Windows-x64-VST3.zip -Algorithm SHA256).Hash.ToLower() + '  Vocals-Rack-Windows-x64-VST3.zip' | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vocals-Rack-Windows-x64-VST3
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Vocals-Rack-Windows-x64-VST3
          path: dist
      - name: Publish compiled Windows plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          Vocals Rack for Windows 64-bit (VST3), with a hardware-style metal interface.

          This update adds contoured chrome faders with brushed highlights and cast shadows, recessed slots, illuminated switches, metal panel texture, screws and glass-fronted meters. The original reference image remains unchanged. The interface PNG shows the actual JUCE editor rendered during the Windows tests, with demonstration control positions.

          Extract the ZIP and copy the entire `Vocals Rack.vst3` folder to `C:\Program Files\Common Files\VST3\`, then rescan plugins in your DAW.

          Built on Windows with MSVC x64 and JUCE. Automated processor, editor-rendering and reference-integrity tests must pass before publication. Live DAW compatibility and listening tests remain pending. Independent DSP implementation; not the official Waves plugin or a verified sonic reproduction.
          NOTES
          gh release create "$RELEASE_TAG" dist/Vocals-Rack-Windows-x64-VST3.zip dist/SHA256SUMS.txt dist/Vocals-Rack-Interface.png --title "Vocals Rack $RELEASE_TAG - Windows x64 VST3" --notes-file /tmp/release-notes.md --prerelease --verify-tag
